name: Sync Sleeper League

on:
  workflow_dispatch:
  schedule:
    # Full daily refresh at 00:17 UTC, including Sleeper's player-ID map.
    - cron: "17 0 * * *"
    # League-only refreshes every 6 hours after that, using the cached player map.
    - cron: "17 6,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: sleeper-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Sync Cloud Dynasty from Sleeper
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$SCHEDULE" == "17 0 * * *" ]]; then
            python sync/sync_sleeper.py --refresh-players
          else
            python sync/sync_sleeper.py
          fi

      - name: Commit changed league data
        shell: bash
        run: |
          git add data/
          if git diff --cached --quiet; then
            echo "No Sleeper data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Sleeper league data"
          git push
